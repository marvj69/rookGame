name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run deterministic validations
        run: npm test

      - name: Run champion smoke match
        run: npm run ai:benchmark -- --mode=quick --profile=live --candidate=challenger --opponent=champion-2026-08-11 --games=2 --workers=2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate browser worker and timeout recovery
        run: npm run test:browser
